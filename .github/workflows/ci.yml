name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password   # throw-away service container, CI only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User=root;Password=ci_only_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings are errors)
        run: dotnet build DddHexagonal.sln -warnaserror
      - name: Tests + coverage (fails if Domain/Application < 100%)
        run: ./scripts/coverage.sh
      - name: Coverage summary
        if: always()
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t dotnet-ddd-hexagonal .
